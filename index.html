<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRASH Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Newsreader', 'serif'],
              display: ['Newsreader', 'serif'],
            },
            colors: {
              paper: '#F7F7F5',
              navy: {
                800: '#1e293b',
                900: '#0f172a',
              },
              brand: {
                blue: '#2C3E96',
                dark: '#1C1C1C',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F7F7F5;
        color: #0f172a;
      }
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px; /* Offset for fixed navbar */
      }
      /* Custom selection color */
      ::selection {
        background: #2C3E96;
        color: white;
      }
      .font-serif {
        font-family: 'Newsreader', serif;
        font-feature-settings: "kern" 1, "liga" 1;
      }
    </style>
</head>
  <body class="bg-paper text-navy-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
